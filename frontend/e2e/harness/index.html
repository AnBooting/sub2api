<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BaseDialog E2E harness</title>
    <style>
      /* 只保留结构与点击区域相关样式，视觉风格不参与断言 */
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.5);
      }
      .modal-content {
        background: #fff;
        border-radius: 8px;
        padding: 16px;
        width: min(480px, 90vw);
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
